[project]
name = "arkb"
version = "0.1.0"
description = "Local retrieval over Markdown notes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "huggingface-hub>=1.30,<2",
    "numpy>=2,<3",
    "ollama>=0.6,<1",
    "qdrant-client>=1.19,<2",
    "tokenizers==0.23.2",
]

[project.scripts]
arkb = "arkb.cli:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=5,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"
