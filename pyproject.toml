[project]
name = "arkb"
version = "0.1.0"
description = "Local retrieval over Markdown notes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "huggingface-hub>=1.30,<2",
    "numpy>=2,<3",
    "ollama>=0.6,<1",
    "qdrant-client>=1.19,<2",
    "tokenizers==0.23.2",
]

[project.scripts]
arkb = "arkb.interfaces.cli:main"

[project.optional-dependencies]
rerank = [
    "torch>=2.6,<3",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
markers = ["integration: requires explicitly enabled model or external-service checks"]
