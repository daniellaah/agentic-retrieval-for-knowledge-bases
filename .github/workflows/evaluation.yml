name: Deterministic evaluation regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
      - name: Install evaluation dependencies
        run: uv sync --locked --extra evaluation
      - name: Install exact-search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Deterministic tests (no model services or public corpus downloads)
        run: uv run --no-sync pytest -q -m 'not integration'
      - name: Freshness contract
        run: uv run --no-sync python evaluation/experiments/p4_regression.py probe --output evaluation/results/ci-freshness
      - name: Current retrieval matches registered public development baseline
        run: uv run --no-sync python evaluation/experiments/check_p4_deterministic.py --output evaluation/results/ci-scifact-regression.json
